<script>
  const element = id => document.getElementById(id);

  const conditionTypes = {
    sender: ["发件地址", [["sender", "发件地址", "email"]]],
    domain: ["发件域名", [["domain", "发件域名", "text", "example.com"]]],
    subject: ["主题包含", [["subject", "主题包含", "text"]]],
    body: ["正文包含", [["body", "正文包含", "text", "匹配邮件前 256 KiB"]]],
    received: ["收件时间", [["received_from", "不早于（本地时间）", "datetime-local"],

  function choice(options, onPick, title) {
    const menu = document.createElement("details");

    panel.className = "choice-options";

    const card = document.createElement("fieldset");

    let hash = 0;
    for (const character of identity) hash = (Math.imul(hash, 31) + character.codePointAt(0)) >>> 0;

    avatar.textContent = initial.toUpperCase();
    const domain = identity.split("@").pop();
    const brand = identity.includes("@") && /^[a-z\d.-]+$/.test(domain) &&
      Object.keys(brandAvatars).find(key => domain === key || domain.endsWith("." + key));

    for (const node of template.content.querySelectorAll("script,iframe,frame,frameset,object,embed,base,meta,link,svg,math,template,form,input,button,textarea,select,video,audio,source,track"))
      node.remove();
    for (const node of template.content.querySelectorAll("*")) {
      for (const attr of [...node.attributes]) {
        if ((attr.name === "src" && node.tagName === "IMG") || attr.name === "background") {
          const source = imageSource(attr.value);
          if (source) node.setAttribute(attr.name, source);
          else node.removeAttribute(attr.name);
        } else if (attr.name === "style") node.setAttribute("style", fixCSS(attr.value));
        else if (attr.name.startsWith("on") || ["src","srcset","href","xlink:href","poster","action","formaction","ping","data","srcdoc"].includes(attr.name))
          node.removeAttribute(attr.name);
      }
      if (node.tagName === "STYLE") node.textContent = fixCSS(node.textContent);
    }
    const frame = document.createElement("iframe");
    frame.className = "mail-original";
    frame.title = "邮件原文";
    frame.setAttribute("sandbox", "");
    frame.referrerPolicy = "no-referrer";
    const sources = loadRemote ? "data: https:" : "data:";
    frame.srcdoc = `<!doctype html><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src ${sources}; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">` + template.innerHTML;
    if (blocked) frame.dataset.remoteImages = "true";
    return frame;
  }
  const reader = element("mail-reader");
  const readerBack = element("reader-back");
  const readerFormat = element("reader-format");
  const readerCopy = element("reader-copy");
  const readerNotices = element("reader-notices");
  const readerContent = element("reader-content");
  const readerMeta = element("reader-meta");
  readerBack.onclick = () => reader.close();
  element("reader-close").onclick = () => reader.close();
  reader.addEventListener("close", () => {
    if (!reader.open) readerContent.replaceChildren();
  });
  async function viewMail(mail) {
    if (busy) return;
    const state = document.createElement("div");
    state.className = "reader-state";
    state.setAttribute("role", "status");
    state.append(glyph("mail"), "正在读取邮件…");
    readerContent.replaceChildren(state);
    readerNotices.replaceChildren();
    element("reader-copy-feedback").replaceChildren();
    readerMeta.hidden = true;
    readerCopy.hidden = true;
    readerFormat.hidden = true;
    readerBack.hidden = !manager.open;
    element("reader-label").hidden = manager.open;
    set("reader-title", mail.subject || "（无主题）");
    if (!reader.open) reader.showModal();
    const active = () => reader.open && state.parentNode === readerContent;
    try {
      const result = (await tool("mail_detail", {uid: mail.uid}))._meta?.data;
      if (!active()) return;
      if (!result) throw new Error("没有收到邮件正文。");
      set("reader-title", result.subject || mail.subject || "（无主题）");
      const sender = document.createElement("span");
      sender.textContent = "发件人：" + (result.sender || "未知");
      const received = document.createElement("time");
      received.textContent = result.received ? "收件时间：" + localTime(result.received) : "";
      if (result.received) received.dateTime = result.received;
      const identity = document.createElement("div");
      identity.className = "reader-sender";
      identity.append(sender);
      if (result.received) identity.append(received);
      readerMeta.replaceChildren(senderAvatar(result.sender || mail.sender), identity);
      readerMeta.hidden = false;
      const hasHTML = result.format === "html" && Boolean(result.body?.trim());
      let plain = !hasHTML;
      let loadRemote = false;
      readerFormat.hidden = !hasHTML || !result.plain_body?.trim();
      function render() {
        readerFormat.textContent = plain ? "查看原文" : "纯文本";
        readerFormat.setAttribute("aria-pressed", String(plain));
        readerNotices.replaceChildren();
        const notice = (icon, message, action) => {
          const row = document.createElement("div");
          row.className = "reader-notice";
          const text = document.createElement("p");
          text.append(glyph(icon), message);
          row.append(text);
          if (action) row.append(action);
          readerNotices.append(row);
        };
        if (result.truncated) notice("circle-alert", "邮件较长，仅显示已读取的部分");
        if (plain) {
          const text = document.createElement("div");
          text.className = "mail-body";
          text.tabIndex = 0;
          text.textContent = (hasHTML ? result.plain_body : result.body) || "没有可显示的正文。";
          readerContent.replaceChildren(text);
          return;
        }
        const frame = originalMail(result.body, result.images, loadRemote);
        if (frame.dataset.remoteImages && !loadRemote) {
          const load = button("加载图片", () => {
            loadRemote = true;
            render();
            readerContent.firstElementChild.focus();
          });
          load.title = "仅为这封邮件加载；图片提供方可能知道你打开了邮件";
          notice("shield-check", "远程图片未加载", load);
        }
        readerContent.replaceChildren(frame);
      }
      readerFormat.onclick = () => { plain = !plain; render(); };
      readerCopy.hidden = !result.reference;
      readerCopy.textContent = "复制引用";
      readerCopy.removeAttribute("aria-label");
      if (result.reference) element("reader-copy-feedback").append(referenceControl(result.reference, "复制引用", "", readerCopy));
      render();
    } catch (error) {
      if (!active()) return;
      state.replaceChildren(glyph("circle-alert"), "打开失败：" + error.message,
        button("重试", () => viewMail(mail), "refresh-cw"));
    }
  }
  function showReplay() {
    const content = document.createElement("div");
    const form = document.createElement("form");
    form.innerHTML = '<div class="mode-bar"><label><input name="mode" type="radio" value="count" checked>按封数</label><label><input name="mode" type="radio" value="dates">按时间段</label></div>' +
      '<div class="form" data-range="count"><label>最近邮件封数<input name="limit" type="number" value="30" min="1" max="100" required></label></div>' +
      '<div class="form" data-range="dates" hidden><label>从（本地时间）<input name="start" type="datetime-local" disabled required></label><label>到（本地时间）<input name="end" type="datetime-local" disabled required></label></div>' +
      '<button class="primary">预览分类</button>';
    const results = document.createElement("div");
    results.className = "replay-results";
    const message = document.createElement("p");
    message.setAttribute("role", "status");
    content.append(form, message, results);
    const clear = () => { message.textContent = ""; results.replaceChildren(); };
    form.addEventListener("input", event => {
      if (event.target.name === "mode") for (const fields of form.querySelectorAll("[data-range]")) {
        fields.hidden = fields.dataset.range !== event.target.value;
        for (const input of fields.querySelectorAll("input")) input.disabled = fields.hidden;
      }
      clear();
    });
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (busy) return;
      clear();
      const fields = new FormData(form);
      const args = fields.get("mode") === "count" ? {limit:Number(fields.get("limit"))} :
        {limit:100, received_from:new Date(fields.get("start")).toISOString(), received_to:new Date(fields.get("end")).toISOString()};
      const controls = [...form.querySelectorAll("input:not(:disabled),button")];
      controls.forEach(control => {control.disabled = true;});
      message.textContent = "正在预览…";
      try {
        const data = (await tool("replay_preview", args))._meta?.data;
        if (!data) throw new Error("没有收到归组结果。");
        const previewCount = data.records.filter(mail => !mail.existing).length;
        message.textContent = "预览 " + data.records.length + " 封 · 可收录 " + previewCount + " 封" +
          (data.truncated ? "。结果不完整，请缩短时间范围查看遗漏的邮件。" : "");
        const list = document.createElement("ul");
        list.className = "group-list";
        for (const mail of data.records) {
          const row = document.createElement("li");
          const detail = document.createElement("p");
          detail.textContent = (mail.existing ? "已收录于「" + mail.existing + "」" : "将归入「" + mail.target + "」") +
            (mail.sender ? " · " + mail.sender : "");
          row.append(senderLine(mail.sender, mailSubject(mail), detail));
          list.append(row);
        }
        results.append(list);
        if (previewCount) {
          const commit = button("确认收录 " + previewCount + " 封", async () => {
            if (busy) return;
            busy = true;
            commit.disabled = true;
            controls.forEach(control => {control.disabled = true;});
            message.textContent = "正在收录…";
            try {
              const outcome = (await tool("replay_import", {token:data.token}))._meta?.data;
              if (!outcome) throw new Error("没有收到收录结果，请重新预览确认。");
              message.textContent = "已收录 " + outcome.imported + " 封，跳过已收录 " + outcome.skipped + " 封。";
              results.replaceChildren();
              await refreshPage();
            } catch (error) { message.textContent = "收录失败：" + error.message; commit.disabled = false; }
            finally { busy = false; controls.forEach(control => {control.disabled = false;}); }
          }, "circle-check");
          commit.className = "primary";
          results.prepend(commit);
        }
      } catch (error) { message.textContent = "预览失败：" + error.message; }
      finally { controls.forEach(control => {control.disabled = false;}); }
    });
    modal("历史回放", content);
  }
  element("replay").onclick = showReplay;
  async function viewGroup(name) {
    const content = document.createElement("div");
    content.textContent = "正在读取收录…";
    modal(name + " · 收录邮件", content);
    try {
      const result = await tool("group_mail", {group: name});

  function showOrder() {
    const content = document.createElement("div");
    const ordered = [...catalog.order.filter(name => name !== "未分类")];
    for (const rule of catalog.rules)
      if (rule.group_name !== "未分类" && !ordered.includes(rule.group_name)) ordered.push(rule.group_name);
    for (const group of catalog.groups)
      if (group.name !== "未分类" && !ordered.includes(group.name)) ordered.push(group.name);
    const note = document.createElement("p");
    note.textContent = catalog.order.length ? "越靠前越优先。「未分类」固定最后。" : "目前沿用原规则顺序。保存分组顺序可能改变之后进入的邮件归属。";
    const list = document.createElement("ol");
    list.className = "order-list";
    function renderOrder() {
      list.replaceChildren(...ordered.map((name, index) => {
        const row = document.createElement("li");
        const title = document.createElement("strong");
        title.textContent = (index + 1) + ". " + name;
        const move = delta => {
          [ordered[index], ordered[index + delta]] = [ordered[index + delta], ordered[index]];
          renderOrder();
          const target = list.children[index + delta].querySelector(delta < 0 ? "button:first-child" : "button:last-child");
          (target.disabled ? list.children[index + delta].querySelector("button:not(:disabled)") : target)?.focus();
        };
        const up = button("上移", () => move(-1));
        const down = button("下移", () => move(1));
        up.disabled = index === 0;
        down.disabled = index === ordered.length - 1;
        const actions = document.createElement("div");
        actions.className = "row-actions";
        actions.append(up, down);
        row.append(title, actions);
        return row;
      }));
    }
    renderOrder();
    const actions = document.createElement("div");
    actions.className = "row-actions";
    const save = button("保存顺序", () => change("set_group_order", {order: [...ordered, "未分类"]}, () => manager.close(), "manage-feedback"));
    save.className = "primary";
    actions.append(save);
    if (catalog.order.length) actions.append(button("恢复原规则顺序", () => change("set_group_order", {order: []}, () => manager.close(), "manage-feedback")));
    content.append(note, list, actions);
    modal("匹配顺序", content);
  }
  element("group-order").onclick = showOrder;
  async function chooseGroup(sender) {
    if (!await showSettings(true)) return;
    const content = document.createElement("div");
    content.className = "group-choice";
    for (const group of catalog.groups.filter(item => item.name !== "未分类")) {
      content.append(button(group.name, () => { manager.close(); openGroup(group, sender); }, "folders"));
    }
    content.append(button("新建分组", () => { manager.close(); openGroup(null, sender); }, "plus"));
    modal("选择邮件要归入的分组", content);
  }
  async function settingsData() {
    const response = await tool("list_rules");
    catalog = JSON.parse(response.content[0].text);
    element("new-group").disabled = false;
    element("group-order").disabled = catalog.groups.length < 2;
    const ordered = [...catalog.groups];
    const position = name => catalog.order.indexOf(name) < 0 ? catalog.order.length : catalog.order.indexOf(name);
    ordered.sort((first, second) => Number(first.name === "未分类") - Number(second.name === "未分类") || position(first.name) - position(second.name));
    element("settings-groups").replaceChildren(...ordered.map(group => {
      const row = document.createElement("li");
      row.className = "group-item";
      const identity = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = group.name;
      const detail = document.createElement("p");
      detail.className = "muted";
      const count = catalog.rules.filter(rule => rule.group_name === group.name).length;
      detail.textContent = group.count + " 封收录 · " + (count ? count + " 条规则" : group.name === "未分类" ? "系统兜底" : "尚无规则");
      identity.append(title, detail);
      const toggle = button(group.notify ? "提醒已开" : "提醒已关",
        () => change("set_group", {name: group.name, notify: !group.notify}), group.notify ? "bell" : "bell-off");
      toggle.setAttribute("role", "switch");
      toggle.setAttribute("aria-checked", Boolean(group.notify));
      toggle.setAttribute("aria-label", group.name + "的桌面提醒");
      if (group.notify) toggle.classList.add("on");
      const actions = document.createElement("div");
      actions.className = "row-actions";
      actions.append(toggle, button("查看", () => viewGroup(group.name)), button("编辑", () => openGroup(group), "pencil"));
      if (group.name !== "未分类") actions.append(button("删除", () => showDelete(group), "trash-2"));
      row.append(identity, actions);
      return row;
    }));
  }
  async function change(name, args, onSaved, feedback = "settings-message") {
    if (!ready || busy) return;
    busy = true;
    const activeDialog = editor.open ? editor : manager.open ? manager : null;
    const dialogBody = activeDialog?.querySelector(".dialog-shell");
    const feedbackNode = element(feedback);
    const controls = dialogBody ? [...dialogBody.querySelectorAll("button:not(:disabled), input:not(:disabled)")]: [];
    for (const control of controls) control.disabled = true;
    if (dialogBody) dialogBody.setAttribute("aria-busy", "true");
    set(feedback, "正在处理…");
    try {
      await tool(name, args);
      if (onSaved) onSaved();
      if (name === "open_mail_setup") {
        element("settings-message").dataset.authorization = "pending";
        set("settings-message", "请在 Mac 授权弹窗输入邮箱地址和新的客户端授权码。");
        return;
      }
      set("settings-message", "已保存。");
      try {
        await settingsData();
        render(await tool("mail_dashboard"));
      } catch { set("settings-message", "已保存，但状态未刷新。请切换标签或点刷新重试。"); }
    } catch (error) {
      set(feedback, error.message === "timeout" ? "响应超时，请先刷新确认是否已保存。" : error.message);
    } finally {
      for (const control of controls) control.disabled = false;
      if (dialogBody) dialogBody.removeAttribute("aria-busy");
      if (activeDialog?.open) { feedbackNode.tabIndex = -1; feedbackNode.focus(); }
      busy = false;
    }
  }
  async function showSettings(show) {
    element("settings").hidden = !show;
    element("overview").hidden = show;
    element("settings-tab").setAttribute("aria-pressed", show);
    element("overview-tab").setAttribute("aria-pressed", !show);
    if (element("connection").dataset.state)
      element("setup").hidden = !show && element("connection").dataset.state === "good";
    if (show && ready) {
      try { await settingsData(); }
      catch { set("settings-message", "暂时无法读取设置，请重试。"); return false; }
    }
    return ready;
  }
  element("settings-tab").addEventListener("click", () => showSettings(true));
  element("overview-tab").addEventListener("click", () => showSettings(false));
  element("setup").addEventListener("click", () => change("open_mail_setup", {}));
  const loadSamples = element("load-samples");
  const moreSamples = element("more-samples");
  const sampleStatus = element("sample-status");
  const pageStatus = element("sample-page-status");
  let sampleCursor = null;
  let loadedSamples = [];
  let loadingSamples = false;
  async function restoreSamples() {
    if (loadingSamples || loadedSamples.length) return;
    await readSamples(false, true);

  async function readSamples(append, cached = false) {
    if (!ready || loadingSamples || (append && !sampleCursor)) return;
    loadingSamples = true;
    loadSamples.disabled = true;
    moreSamples.disabled = true;
    const status = append ? pageStatus : sampleStatus;
    delete status.dataset.result;
    const previousStatus = status.textContent;
    status.textContent = cached ? "正在恢复本地邮件列表…" : append ? "正在加载更早的邮件…" : "正在读取收件箱…";
    try {
      const result = await tool("inbox_samples", cached ? {cached:true} : append ? {cursor:sampleCursor} : {});
      const samples = result?._meta?.samples;
      if (cached && !result?._meta?.cached_at) {
        status.textContent = previousStatus;
        return;
      }
      if (!Array.isArray(samples)) throw new Error("没有收到邮件数据。");
      if (!append) {
        loadedSamples = [];
        element("samples").replaceChildren();
      }
      const previous = new Set(loadedSamples.map(mail => mail.uid));
      const added = samples.filter(mail => !previous.has(mail.uid));
      loadedSamples.push(...added);
      sampleCursor = result._meta.next_cursor || null;
      sampleSenders = [...new Set(loadedSamples.map(mail => mail.sender).filter(Boolean))];
      const newRows = added.map(mail => {
        const row = document.createElement("li");
        const subject = mailSubject(mail);
        const details = document.createElement("p");
        details.className = "sample-meta";
        const sender = document.createElement("span");
        sender.textContent = mail.sender || "发件人未知";
        details.append(sender);
        if (mail.received) {
          const date = document.createElement("time");
          date.dateTime = mail.received;
          date.className = "sample-time";
          date.textContent = localTime(mail.received);
          details.append(date);
        }
        const action = button("建规则", () => chooseGroup(mail.sender), "plus");
        action.className = "column-action";
        action.setAttribute("aria-label", mail.sender ? "按发件人 " + mail.sender + " 建规则" : "发件人未知，无法建规则");
        action.title = "按发件人建规则";
        action.disabled = !mail.sender;
        row.append(senderLine(mail.sender, subject, details), action);
        return row;
      });
      element("samples").append(...newRows);
      sampleStatus.textContent = loadedSamples.length ? "已加载 " + loadedSamples.length + " 封" :
        sampleCursor ? "本批邮件已不在收件箱" : "收件箱没有邮件";
      if (cached) sampleStatus.textContent += " · 本地缓存";
      sampleStatus.title = cached ? "缓存时间：" + localTime(result._meta.cached_at) : "";
      sampleStatus.dataset.result = "good";
      delete pageStatus.dataset.result;
      pageStatus.textContent = !sampleCursor ? "已加载全部邮件" : append ? "本次新增 " + added.length + " 封" : "";
      element("sample-footer").hidden = !loadedSamples.length && !sampleCursor;
      moreSamples.hidden = !sampleCursor;
      moreSamples.textContent = "继续加载 10 封";
      loadSamples.textContent = "重新加载";
      loadSamples.prepend(glyph("refresh-cw"));
      if (append && newRows.length) newRows[0].querySelector(".mail-link").focus({preventScroll:true});
      else if (append && !sampleCursor) pageStatus.focus({preventScroll:true});
    } catch (error) {
      status.dataset.result = "error";
      status.textContent = "读取失败：" + (error.message === "timeout" ? "连接超时" : error.message);
      if (append) moreSamples.textContent = "重试加载";
    } finally {
      loadingSamples = false;
      loadSamples.disabled = !ready;
      moreSamples.disabled = !ready || !sampleCursor;
    }
  }
  loadSamples.addEventListener("click", () => readSamples(false));
  moreSamples.addEventListener("click", () => readSamples(true));
  function refreshResult(icon, message, state) {
    const status = element("refresh-result");
    status.dataset.result = state;
    status.replaceChildren(glyph(icon), message);
  }
  async function refreshPage() {
    refresh.disabled = true;
    refreshState = null;
    refreshResult("refresh-cw", "正在刷新…", "");
    try {
      const result = await tool("mail_dashboard");
      if (!result?._meta?.dashboard) throw new Error("没有收到状态数据");
      render(result);
      if (!element("settings").hidden) await settingsData();
      refreshState = {icon:"circle-check",message:"读取成功",state:"good"};
    }
    catch (error) {
      refreshState = {icon:"circle-alert",message:"读取失败：" + (error.message === "timeout" ? "连接超时" : error.message),state:"error"};
    }
    finally { refreshTime = new Date(); paintTimes(); refresh.disabled = !ready; }
  }
  refresh.addEventListener("click", refreshPage);
  setInterval(paintTimes, 15000);
  request("ui/initialize", {appInfo:{name:"QQ 邮箱",version:"1.7.6"},appCapabilities:{},protocolVersion:"2026-01-26"})
    .then(() => {
      send({method:"ui/notifications/initialized"});
      ready = true;
      refresh.disabled = false;
      element("setup").disabled = false;
      loadSamples.disabled = false;
      refreshPage();
      restoreSamples();
    })
    .catch(() => set("message", "无法连接 Codex。请从桌面版的插件入口打开此页面。"));
